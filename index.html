<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
    <title>Frontend Mentor | Profile card component</title>
    <link rel="stylesheet" href="estilos.css">
</head>

<body>
    <main>
        <article class="card">
            <header class="card__header">
                <div class="banner"></div>
                <div class="card__avatar">
                    <img src="images/image-victor.jpg" alt="photo-profile" class="photo"></img>
                </div>
            </header>

            <section class="card__body text__center">
                <p class="card__text">
                    Victor Crest
                    <span class="card__text card__text--light">26</span>
                </p>
                <p class="card__text card__text--light">London</p>
            </section>

            <div class="line-separator"></div>

            <footer class="card__footer">
                <div class="card__stats">
                    <div class="card__stat">
                        <h3 class="card__text">80K</h3>
                        <p class="card__text card__text--light text__small">Followers</p>
                    </div>
                    <div class="card__stat">
                        <h3 class="card__text">803K</h3>
                        <p class="card__text card__text--light text__small">Likes</p>
                    </div>
                    <div class="card__stat">
                        <h3 class="card__text">1.4K</h3>
                        <p class="card__text card__text--light text__small">Photos</p>
                    </div>
                </div>
            </section>
        </article>
    </main>

    <footer class="attribution">
        Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
        Coded by <a href="#">Your Name Here</a>.
    </footer>
</body>

</html>
